<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 15px;
            background-color: rgba(88, 181, 204, 0.534)
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #50b3cc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #50b3cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .rn-data-box {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px dashed #3b879a;
            margin-top: 25px;
        }

        .rn-data-title {
            font-size: 11px;
            color: #3b879a;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .rn-data-content {
            font-size: 15px;
            color: #222;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h3>Capacitor Giriş Katmanı</h3>
    <input id="user_capacitor" type="text" placeholder="React Native'e gönderilecek isim...">
    
    <button id="btn_send" onclick="handleButtonClick()">İsmi React Native'e Gönder</button>

    <div class="rn-data-box">
        <div class="rn-data-title">React Native'den Gelen Mesaj:</div>
        <div id="output_from_rn" class="rn-data-content">Henüz bir veri yollanmadı...</div>
    </div>

    <script>
        console.log("Köprü kontrolü - AndroidInterface:", !!window.AndroidInterface);
        console.log("Köprü kontrolü - AndroidBridge:", !!window.AndroidBridge);

        function handleButtonClick() {
            const inputValue = document.getElementById('user_capacitor').value;
            
            if (inputValue.trim() === "") {
                alert("Lütfen boş bırakmayın!");
                return;
            }

            if (window.AndroidInterface && typeof window.AndroidInterface.sendData === 'function') {
                window.AndroidInterface.sendData(inputValue);
            } 
            else if (window.AndroidBridge && typeof window.AndroidBridge.sendData === 'function') {
                window.AndroidBridge.sendData(inputValue);
            }
            else {
                alert("Kotlin Köprüsü Bulunamadı! Yazılan Değer: " + inputValue);
            }
        }

        window.handleDataFromReactNative = function(data) {
            

            const outputDiv = document.getElementById("output_from_rn");
            if (outputDiv) {
                outputDiv.innerText = data;
                outputDiv.style.color = "green";
            }
        };
    </script>
</body>
</html>
