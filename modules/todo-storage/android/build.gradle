plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.todostorage'
version = '0.1.0'

dependencies {
  implementation("androidx.datastore:datastore-preferences:1.1.7")
}

android {
  namespace "expo.modules.todostorage"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
